name: Apply grammar hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply grammar patch
        run: |
          git apply .grammar-hardening.patch
          rm -f .grammar-hardening.patch .github/workflows/apply-grammar-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden mixed parenthesis grammar and add differential corpus"
          git push
