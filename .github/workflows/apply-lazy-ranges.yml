name: Apply lazy ranges

on:
  push:
    branches: [main]
    paths:
      - '.sync/lazy-ranges.patch.xz.b64'
      - '.github/workflows/apply-lazy-ranges.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested lazy-range checkpoint
        run: |
          base64 -d .sync/lazy-ranges.patch.xz.b64 | xz -d > /tmp/lazy-ranges.patch
          echo 'a5bf83098516544e4c5fe3fce596bf6558e63d46dc309f81e5321bbc6ffe9bbb  /tmp/lazy-ranges.patch' | sha256sum -c -
          git apply /tmp/lazy-ranges.patch
          rm -rf .sync .github/workflows/apply-lazy-ranges.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make ranges lazy immutable sequence values"
          git push
