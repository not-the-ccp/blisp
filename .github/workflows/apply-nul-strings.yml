name: Apply lossless string representation checkpoint

on:
  push:
    branches: [main]
    paths:
      - '.sync/apply-nul-strings.py'
      - '.github/workflows/apply-nul-strings.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify lossless strings
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.sync/apply-nul-strings.py')
          s = path.read_text()
          needle = "rep('surface.sh',old,new)\n# All parser str tokens are now hex. There are two direct datum/primary cases.\n"
          replacement = r'''surface_path=Path('surface.sh')
          surface_text=surface_path.read_text()
          marker='this reference implementation cannot store NUL in strings; use bytes'
          mid=surface_text.find(marker)
          if mid < 0:
              raise SystemExit('surface string lexer NUL-rejection anchor missing')
          lines=surface_text.splitlines(keepends=True)
          offset=0
          a=-1
          for i,line in enumerate(lines):
              next_offset=offset+len(line)
              if offset < mid and line.startswith('    if [[ $c == ') and ' || $c == ' in line:
                  nearby=''.join(lines[i:i+3])
                  if 'q=$c' in nearby:
                      a=offset
              offset=next_offset
          if a < 0:
              raise SystemExit('surface string lexer outer-branch anchor missing')
          end_marker='      sx_tok str "$buf" "$gap"; gap=0; continue\n    fi\n'
          b=surface_text.find(end_marker, mid)
          if b < 0:
              raise SystemExit('surface string lexer end anchor missing')
          b += len(end_marker)
          old_block=surface_text[a:b]
          if 'unterminated string escape' not in old_block or 'case $esc in' not in old_block:
              raise SystemExit('surface lexer anchor found an unexpected block')
          if old_block.count(marker) != 1 or old_block.count('q=$c') != 1:
              raise SystemExit('surface lexer block is ambiguous')
          surface_path.write_text(surface_text[:a]+new+surface_text[b:])
          # All parser str tokens are now hex. There are two direct datum/primary cases.
          '''
          if s.count(needle) != 1:
              raise SystemExit('migration surface replacement hook is missing or ambiguous')
          path.write_text(s.replace(needle, replacement))
          PY

          python3 .sync/apply-nul-strings.py

          python3 - <<'PY'
          from pathlib import Path

          # Build the textual \xHH stream without asking printf to parse a
          # half-formed \x escape in its own format string.
          p=Path('runtime.sh')
          s=p.read_text()
          a=s.find('bl_string_write_fd() {\n')
          b=s.find('bl_string_write_path()', a)
          if a < 0 or b < 0:
              raise SystemExit('string writer function anchors missing')
          writer=r'''bl_string_write_fd() {
            local v=$1 fd=$2 i pair esc= chunk=0
            bl_string_hex "$v" || return; local hex=$RET
            for ((i=0;i<${#hex};i+=2)); do
              pair=${hex:i:2}; esc+="\\x$pair"; ((++chunk)) || true
              if ((chunk>=2048)); then printf '%b' "$esc" >&"$fd" || return; esc=; chunk=0; fi
            done
            [[ -z $esc ]] || printf '%b' "$esc" >&"$fd"
          }
          '''
          p.write_text(s[:a]+writer+s[b:])

          # Normalize only the text-string escape branch. Byte literals have a
          # separate, already-tested escape parser and must not be touched.
          p=Path('surface.sh')
          lines=p.read_text().splitlines(keepends=True)
          string_if=-1
          string_end=-1
          for i,line in enumerate(lines):
              if i+1 < len(lines) and 'if [[ $c ==' in line and 'unterminated string escape' in lines[i+1]:
                  if string_if != -1:
                      raise SystemExit('multiple text-string escape branches')
                  string_if=i
              if string_if != -1 and i >= string_if and 'sx_tok str "$buf"' in line:
                  string_end=i
                  break
          if string_if < 0 or string_end < 0:
              raise SystemExit('text-string escape branch not found')
          indent=lines[string_if][:len(lines[string_if])-len(lines[string_if].lstrip())]
          lines[string_if]=indent+'if [[ $c == \\\\ ]]; then\n'
          case_sites=[]
          for i in range(string_if, string_end+1):
              if 'buf+=5c;;' in lines[i]:
                  case_sites.append(i)
          if len(case_sites) != 1:
              raise SystemExit(f'unexpected text-string backslash case sites: {case_sites}')
          i=case_sites[0]
          pos=lines[i].index('buf+=5c;;')
          indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
          lines[i]=indent+'\\\\) '+lines[i][pos:]
          p.write_text(''.join(lines))
          PY

          bash -n blisp runtime.sh compiler.sh surface.sh layout.sh tests/*.sh

          printf '%s\n' '[nul probe] hybrid length/equality/utf8'
          ./blisp evalx '"\0".length'
          ./blisp evalx '"\0" == "\0"'
          ./blisp evalx '"\0".encode("utf-8").hex()'
          printf '%s\n' '[nul probe] classic length'
          ./blisp eval '(string-length "\0")'

          source tests/differential-lib.sh
          parity_suite string-nul tests/string-nul.blx
          bash tests/fast.sh
          bash tests/stdlib-parity.sh

          rm -rf .sync .github/workflows/apply-nul-strings.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Represent embedded NUL losslessly in strings'
          git push
