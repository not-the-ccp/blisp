name: Apply lossless string representation checkpoint

on:
  push:
    branches: [main]
    paths:
      - '.sync/nul-transform.xz.b64'
      - '.github/workflows/apply-nul-strings.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize migration source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .sync/nul-transform.xz.b64 | xz -d > .sync/apply-nul-strings.py
          echo 'f83481561c5136e51642c0f549a27919966d1fb25cf1cd10af1c3283b5a9bfee  .sync/apply-nul-strings.py' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .sync/apply-nul-strings.py
          git commit -m 'Materialize readable NUL string migration'
          git push
