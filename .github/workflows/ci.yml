name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semantic-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fast semantic differential suite
        run: bash tests/fast.sh

  stdlib-parity:
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Standard-library group ${{ matrix.group }} parity
        run: bash tests/stdlib-parity.sh ${{ matrix.group }}
