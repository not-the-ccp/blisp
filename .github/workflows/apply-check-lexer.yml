name: Apply lexer diagnostics and check command

on:
  push:
    branches: [main]
    paths:
      - '.sync/apply-check-lexer.py'
      - '.github/workflows/apply-check-lexer.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify tooling checkpoint
        run: |
          python3 .sync/apply-check-lexer.py
          bash -n blisp runtime.sh compiler.sh surface.sh layout.sh tests/*.sh
          bash tests/diagnostics.sh
          rm -rf .sync .github/workflows/apply-check-lexer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify lexer diagnostics and add parse-only check"
          git push
