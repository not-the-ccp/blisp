name: Apply token-aware include loader

on:
  push:
    branches: [main]
    paths:
      - '.sync/include-loader.patch.xz.b64'
      - '.github/workflows/apply-include-loader.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested include-loader checkpoint
        run: |
          base64 -d .sync/include-loader.patch.xz.b64 | xz -d > /tmp/include-loader.patch
          echo 'd1d6759ce78f5ee21f2c3088aed02bd95724a43bf665d40af238da20fcae2f5a  /tmp/include-loader.patch' | sha256sum -c -
          git apply /tmp/include-loader.patch
          rm -rf .sync .github/workflows/apply-include-loader.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make include a token-aware top-level source directive"
          git push
