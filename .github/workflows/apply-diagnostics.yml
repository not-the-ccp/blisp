name: Apply source provenance diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.sync/apply-diagnostics.py'
      - '.github/workflows/apply-diagnostics.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply diagnostics checkpoint
        run: |
          python3 .sync/apply-diagnostics.py
          bash -n blisp runtime.sh compiler.sh surface.sh layout.sh tests/*.sh
          bash tests/diagnostics.sh
          rm -rf .sync .github/workflows/apply-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add file-aware hybrid parse diagnostics"
          git push
